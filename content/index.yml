  description: |
    我于2025年从重庆毕业，目前在中职学校担任物联网相关教学，同时也从事嵌入式开发工作。我热衷于将技术与设计相结合，致力于打造出美观且实用的产品，希望科技回归人性，服务于人类的生活。
    
