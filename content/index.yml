faq:
  title: 常见的问题
  description: 关于我的工作流程和服务的常见问题解答。
  categories:
    - title: 服务与流程
      questions:
        - label: 你提供哪些服务？
          content: |
            我提供全面的嵌入式软件开发和硬件设计开发服务，包括需求分析、系统设计、原型开发、用户测试、前端实现以及产品交付。我专注于创建用户友好的数字体验，确保设计与技术的无缝结合。
        - label: 你的设计流程是怎样的？
          content: |
            通过你的需求与想法敲定对于你最好的方案。
        - label: 你们与初创公司合作吗？     
          content: |
            当然! 我非常乐意与初创公司合作，帮助他们打造让人振奋人心的产品。
    - title: 价格与时间表
      questions:
        - label: 一个项目通常需要多少钱?
          content: |
            根据项目的复杂程度、功能和时间线有所不同。对于完整的产品开发，我的服务价格通常为2万人民币，平均项目费用在8000至2.5万人名币之间。
        - label: 您的付款方式?
          content: |
            通常需要支付30%的定金以安排项目并开始实施，剩余的70%在项目进行和完成时候进行支付。我接受微信、支付宝和银行卡的支付方式，并可以提供发票。
        - label: 一个典型的项目?
          content: |
            项目的时间线很大程度上取决于项目的规模和复杂程度。小型项目可能需要3到4周，而较大且更复杂的项目则可能需要2到4个月。在初步调研阶段后，我总会提供详细的工期估算。
        - label: D你们提供保持器或持续支持吗？
          content: |
            当然，对于每一个项目我将会提供1年的完全技术支持和2年的有限的技术支持，3年后可以提供付费的完全技术支持。
    - title: 关于我
      questions:
        - label: 我的工作想法?
          content: |
            我热爱我的工作，我希望将科技的便利带给所有人，做出美观与实际的产品。
        - label: 工作之外你有什么爱好？
          content: |
            当我没有工作休息的时候，我经常回去户外徒步旅行看看山川险阻。我也热爱咖啡，会去附近街区的咖啡馆喝咖啡和看书。
