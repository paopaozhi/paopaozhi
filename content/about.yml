title: 关于我
description: 了解更多关于我作为嵌入式工程师和软件开发的成长经历、我的教育经历和我的设计理念，以及我对开发产品的设计理念。
content: |
  你好, 我是 **赵志豪**, 一个嵌入式开发工程师兼中职教师，目前居住在重庆北碚，喜欢咖啡和户外远足，

  ### 我的教育与工程理念

  我的理念扎根于**实践**与**解决问题**。我认为优质的技术教学，先要弄懂背后的 “为什么”—— 每个项目底层的原理、工程取舍以及真实场景需求。我依靠实物原型搭建、反复调试、竞赛导向的训练，引导学生把抽象知识转化为可运行的系统。

  我追求稳定、易维护的技术方案，让硬件与软件协同共生。无论是为 STM32/ESP32 编写固件，基于 ONNX Runtime 调优 YOLO 视觉链路，搭建流媒体服务，还是用 Vue/Nuxt 开发前端界面，我的核心目标始终是产出可用、可复现、具备实际价值的工程成果。

  ### 驱动我的动力

  我希望探索新的技术与内容，将这些新的有意思的东西，在合适的时候应用在我的产品中我会非常的开心，对此我愿意花费很多的时间来实现。
  
  感谢来访。欢迎浏览我的[项目作品](/projects)，如果想要合作交流，欢迎[联系我](/#contact)！
